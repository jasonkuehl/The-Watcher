name: Security Scan

# Replaces CodeQL, which only reports to GitHub's Security tab.
# Findings are printed in the job log; HIGH/CRITICAL issues fail the run.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 16 * * 2'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (JavaScript/TypeScript + workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/github-actions \
            --severity ERROR \
            --error \
            --metrics=off

  trivy:
    name: Trivy (dependencies + misconfiguration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # aquasecurity/trivy-action fetches its installer from GitHub with the job token,
      # which is a Gitea token here, so install the release binary directly
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "$file" trivy && install -m 755 trivy /usr/local/bin/trivy && rm -f trivy "$file"
          trivy --version

      - name: Run Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
